<!DOCTYPE html>
<html>
<head>
    <title>Parent Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #FF6B6B 0%, #FFD93D 100%); padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 16px; padding: 30px; }
        .header { text-align: center; margin-bottom: 30px; }
        .card { background: #f8f9fa; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .card h3 { margin-top: 0; color: #666; }
        input, select, button { padding: 10px; margin: 5px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif; }
        button { background: #FF6B6B; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Chore Tracker</h1>
        </div>

        <div class="card">
            <h3>Chores</h3>
            <input type="text" id="cName" placeholder="Chore name">
            <input type="number" id="cAmount" placeholder="Amount" step="0.5">
            <button onclick="addChore()">Add Chore</button>
            <div id="chores"></div>
        </div>

        <div class="card">
            <h3>Deductions</h3>
            <select id="dTeen">
                <option value="">Select teen</option>
                <option value="1">Nicola</option>
                <option value="2">Camille</option>
            </select>
            <input type="number" id="dAmount" placeholder="Amount" step="0.5">
            <input type="text" id="dReason" placeholder="Reason">
            <button onclick="addDeduction()">Add Deduction</button>
            <div id="deductions"></div>
        </div>

        <div class="card">
            <h3>Totals</h3>
            <div id="totals"></div>
        </div>
    </div>

    <script>
        var data = { chores: [], deductions: [] };

        function addChore() {
            var n = document.getElementById('cName').value;
            var a = parseFloat(document.getElementById('cAmount').value);
            if (n && a) {
                data.chores.push({id: Date.now(), name: n, amount: a});
                localStorage.setItem('chores', JSON.stringify(data.chores));
                document.getElementById('cName').value = '';
                document.getElementById('cAmount').value = '';
                display();
            }
        }

        function deleteChore(i) {
            data.chores.splice(i, 1);
            localStorage.setItem('chores', JSON.stringify(data.chores));
            display();
        }

        function addDeduction() {
            var t = parseInt(document.getElementById('dTeen').value);
            var a = parseFloat(document.getElementById('dAmount').value);
            var r = document.getElementById('dReason').value;
            if (t && a && r) {
                data.deductions.push({teen: t, amount: a, reason: r});
                localStorage.setItem('deductions', JSON.stringify(data.deductions));
                document.getElementById('dTeen').value = '';
                document.getElementById('dAmount').value = '';
                document.getElementById('dReason').value = '';
                display();
            }
        }

        function deleteDeduction(i) {
            data.deductions.splice(i, 1);
            localStorage.setItem('deductions', JSON.stringify(data.deductions));
            display();
        }

        function display() {
            var h = '';
            for (var i = 0; i < data.chores.length; i++) {
                h += '<div style="padding:10px; margin:5px 0; background:white; border-radius:8px;"><span>' + data.chores[i].name + ' - $' + data.chores[i].amount + '</span> <button onclick="deleteChore(' + i + ')" style="float:right;">Delete</button></div>';
            }
            document.getElementById('chores').innerHTML = h;

            h = '';
            for (var i = 0; i < data.deductions.length; i++) {
                h += '<div style="padding:10px; margin:5px 0; background:white; border-radius:8px;"><span>' + data.deductions[i].reason + ' (-$' + data.deductions[i].amount + ')</span> <button onclick="deleteDeduction(' + i + ')" style="float:right; background:#e74c3c;">Remove</button></div>';
            }
            document.getElementById('deductions').innerHTML = h;

            h = '';
            var n = {1:'Nicola', 2:'Camille'};
            for (var t = 1; t <= 2; t++) {
                var tot = 0;
                for (var i = 0; i < data.deductions.length; i++) {
                    if (data.deductions[i].teen == t) tot -= data.deductions[i].amount;
                }
                h += '<div style="padding:10px; margin:5px 0; background:white; border-radius:8px;"><strong>' + n[t] + '</strong> $' + tot.toFixed(2) + '</div>';
            }
            document.getElementById('totals').innerHTML = h;
        }

        var saved1 = localStorage.getItem('chores');
        if (saved1) data.chores = JSON.parse(saved1);
        var saved2 = localStorage.getItem('deductions');
        if (saved2) data.deductions = JSON.parse(saved2);
        display();
        console.log('Ready!');
    </script>
</body>
</html>
