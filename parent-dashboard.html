<!DOCTYPE html>
<html>
<head>
    <title>Parent Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #FF6B6B 0%, #FFD93D 100%); padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 16px; padding: 30px; }
        h1 { text-align: center; color: #333; }
        .card { background: #f8f9fa; padding: 20px; border-radius: 12px; margin: 20px 0; }
        .card h3 { color: #666; margin-top: 0; }
        input, select, button { padding: 10px; margin: 5px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif; }
        button { background: #FF6B6B; color: white; border: none; cursor: pointer; font-weight: 600; }
        button:hover { background: #e74c3c; }
        .item { padding: 10px; margin: 5px 0; background: white; border-radius: 8px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Parent Dashboard</h1>

        <div class="card">
            <h3>Chores (for both teens)</h3>
            <input type="text" id="choreName" placeholder="Name">
            <input type="number" id="choreAmount" placeholder="$" step="0.5">
            <button onclick="addChore()">Add</button>
            <div id="choresList"></div>
        </div>

        <div class="card">
            <h3>Deductions</h3>
            <select id="teen">
                <option value="">Teen</option>
                <option value="nicola">Nicola</option>
                <option value="camille">Camille</option>
            </select>
            <input type="number" id="amount" placeholder="$" step="0.5">
            <input type="text" id="reason" placeholder="Reason">
            <button onclick="addDeduction()">Add</button>
            <div id="deductionsList"></div>
        </div>

        <div class="card">
            <h3>Totals</h3>
            <div id="totals"></div>
        </div>
    </div>

    <script>
        var chores = [];
        var deductions = [];

        function load() {
            var c = localStorage.getItem('chores');
            if (c) chores = JSON.parse(c);
            var d = localStorage.getItem('deductions');
            if (d) deductions = JSON.parse(d);
            show();
        }

        function save() {
            localStorage.setItem('chores', JSON.stringify(chores));
            localStorage.setItem('deductions', JSON.stringify(deductions));
        }

        function addChore() {
            var n = document.getElementById('choreName').value;
            var a = parseFloat(document.getElementById('choreAmount').value);
            if (n && a) {
                chores.push({name: n, amount: a});
                document.getElementById('choreName').value = '';
                document.getElementById('choreAmount').value = '';
                save();
                show();
            }
        }

        function deleteChore(i) {
            chores.splice(i, 1);
            save();
            show();
        }

        function addDeduction() {
            var t = document.getElementById('teen').value;
            var a = parseFloat(document.getElementById('amount').value);
            var r = document.getElementById('reason').value;
            if (t && a && r) {
                deductions.push({teen: t, amount: a, reason: r});
                document.getElementById('teen').value = '';
                document.getElementById('amount').value = '';
                document.getElementById('reason').value = '';
                save();
                show();
            }
        }

        function deleteDeduction(i) {
            deductions.splice(i, 1);
            save();
            show();
        }

        function show() {
            var h = '';
            for (var i = 0; i < chores.length; i++) {
                h += '<div class="item"><span>' + chores[i].name + ' - $' + chores[i].amount + '</span><button style="padding:5px 10px;" onclick="deleteChore(' + i + ')">Delete</button></div>';
            }
            document.getElementById('choresList').innerHTML = h;

            h = '';
            for (var i = 0; i < deductions.length; i++) {
                h += '<div class="item"><span>' + deductions[i].teen + ' - ' + deductions[i].reason + ' (-$' + deductions[i].amount + ')</span><button style="padding:5px 10px; background:#e74c3c;" onclick="deleteDeduction(' + i + ')">Remove</button></div>';
            }
            document.getElementById('deductionsList').innerHTML = h;

            var t1 = 0, t2 = 0;
            for (var i = 0; i < deductions.length; i++) {
                if (deductions[i].teen == 'nicola') t1 -= deductions[i].amount;
                if (deductions[i].teen == 'camille') t2 -= deductions[i].amount;
            }
            h = '<div class="item"><span><strong>Nicola</strong></span><span>$' + t1.toFixed(2) + '</span></div>';
            h += '<div class="item"><span><strong>Camille</strong></span><span>$' + t2.toFixed(2) + '</span></div>';
            document.getElementById('totals').innerHTML = h;
        }

        load();
    </script>
</body>
</html>
