<!DOCTYPE html>
<html>
<head>
    <title>Nicola's Chores</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #FF6B6B 0%, #FFD93D 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #FF6B6B 0%, #FFD93D 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .day-display { font-size: 28px; opacity: 0.9; margin-bottom: 20px; font-weight: 600; }
        .week-nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 30px; background: #f8f9fa; border-bottom: 1px solid #e0e0e0; }
        .day-btn { background: white; border: 1.5px solid #e0e0e0; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; }
        .day-btn:hover { border-color: #FF6B6B; color: #FF6B6B; }
        .day-btn.active { background: #FF6B6B; color: white; border-color: #FF6B6B; }
        .content { padding: 30px; }
        .card { background: #f8f9fa; padding: 24px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #e0e0e0; }
        .total-box { text-align: center; margin-bottom: 30px; }
        .total-label { font-size: 14px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 8px; }
        .total-amount { font-size: 48px; font-weight: 700; background: linear-gradient(135deg, #FF6B6B 0%, #FFD93D 100%); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .chore-checkbox { display: flex; align-items: center; gap: 12px; padding: 14px; background: white; border: 1.5px solid #e0e0e0; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
        .chore-checkbox:hover { border-color: #FF6B6B; background: #fff6f6; }
        .chore-checkbox.disabled { cursor: not-allowed; opacity: 0.5; background: #f5f5f5; }
        .chore-checkbox.disabled:hover { border-color: #e0e0e0; }
        .chore-checkbox input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: #FF6B6B; }
        .chore-checkbox.disabled input[type="checkbox"] { cursor: not-allowed; }
        .chore-checkbox.completed { background: #f0f8f0; border-color: #27ae60; }
        .chore-checkbox.completed .chore-text { text-decoration: line-through; color: #999; }
        .chore-text { flex: 1; }
        .chore-text strong { display: block; margin-bottom: 4px; }
        .chore-text small { color: #999; font-size: 12px; }
        .amount { font-weight: 700; color: #FF6B6B; font-size: 16px; }
        .empty { text-align: center; padding: 30px 20px; color: #999; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Nicola</h1>
            <div class="day-display" id="dayDisplay"></div>
        </div>

        <div class="week-nav">
            <button class="day-btn" onclick="selectDay(0)">Sun</button>
            <button class="day-btn" onclick="selectDay(1)">Mon</button>
            <button class="day-btn" onclick="selectDay(2)">Tue</button>
            <button class="day-btn" onclick="selectDay(3)">Wed</button>
            <button class="day-btn" onclick="selectDay(4)">Thu</button>
            <button class="day-btn" onclick="selectDay(5)">Fri</button>
            <button class="day-btn" onclick="selectDay(6)">Sat</button>
        </div>

        <div class="content">
            <div class="total-box">
                <div class="total-label">Total Earned This Week</div>
                <div class="total-amount" id="weekTotal">$0.00</div>
            </div>

            <div id="choreList"></div>

            <div id="deductionList" style="margin-top: 30px;"></div>
        </div>
    </div>

    <script>
        let currentDay = new Date().getDay();
        let state = {
            chores: [],
            completed: [], // { date: 'YYYY-MM-DD', choreId }
            deductions: [] // { date: 'YYYY-MM-DD', amount, reason }
        };

        function load() {
            let saved = localStorage.getItem('nicola-tracker');
            if(saved) {
                try { state = JSON.parse(saved); } catch(e) { }
            }
            sync();
            render();
        }

        function sync() {
            let parent = localStorage.getItem('parent-chores');
            if(parent) {
                try {
                    let p = JSON.parse(parent);
                    state.chores = p.chores || [];
                    state.deductions = (p.deductions || []).filter(d => d.teen === 1);
                    save();
                } catch(e) { }
            }
        }

        function save() {
            localStorage.setItem('nicola-tracker', JSON.stringify(state));
        }

        function selectDay(day) {
            currentDay = day;
            render();
        }

        function getDayCode(day) {
            const codes = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
            return codes[day];
        }

        function getDateForDay(day) {
            let today = new Date();
            let todayDay = today.getDay();
            let diff = day - todayDay;
            let date = new Date(today);
            date.setDate(date.getDate() + diff);
            return date.toISOString().split('T')[0];
        }

        function render() {
            renderDay();
            renderChores();
            renderDeductions();
            renderTotal();
        }

        function renderDay() {
            let date = new Date();
            let diff = currentDay - date.getDay();
            date.setDate(date.getDate() + diff);
            let dateStr = date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            document.getElementById('dayDisplay').textContent = dateStr;

            // Highlight active day button
            document.querySelectorAll('.day-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === currentDay);
            });
        }

        function renderChores() {
            let html = '';
            let dayCode = getDayCode(currentDay);
            let date = getDateForDay(currentDay);

            if(state.chores.length === 0) {
                html = '<div class="empty">No chores assigned</div>';
            } else {
                let hasChores = false;
                state.chores.forEach(c => {
                    if(c.days.includes(dayCode)) {
                        hasChores = true;
                        let completionKey = date + '-' + c.id;
                        let isCompleted = state.completed.some(comp => comp.date === date && comp.choreId === c.id);
                        let completedClass = isCompleted ? 'completed' : '';
                        let checkedAttr = isCompleted ? 'checked' : '';

                        html += `<label class="chore-checkbox ${completedClass}">
                            <input type="checkbox" ${checkedAttr} onchange="toggleChore(${c.id}, '${date}')">
                            <div class="chore-text">
                                <strong>${c.name}</strong>
                                ${c.name.includes('Walk dog') ? '<small>⏱ 20 minutes required</small>' : ''}
                            </div>
                            <span class="amount">+$${c.amount}</span>
                        </label>`;
                    }
                });
                if(!hasChores) {
                    html = '<div class="empty">No chores scheduled for this day</div>';
                }
            }
            document.getElementById('choreList').innerHTML = html;
        }

        function renderDeductions() {
            let html = '';
            if(state.deductions.length === 0) {
                html = '';
            } else {
                html = '<div style="background: #fff0f0; padding: 20px; border-radius: 12px; border: 1px solid #e74c3c;"><div style="font-weight: 600; color: #e74c3c; margin-bottom: 12px;">⚠️ Deductions This Week:</div>';
                state.deductions.forEach(d => {
                    html += `<div style="padding: 8px 0; border-bottom: 1px solid #ffe0e0; display: flex; justify-content: space-between;">
                        <span>${d.reason}</span>
                        <span style="color: #e74c3c; font-weight: 700;">-$${d.amount}</span>
                    </div>`;
                });
                html += '</div>';
            }
            document.getElementById('deductionList').innerHTML = html;
        }

        function renderTotal() {
            let earnings = 0;
            state.completed.forEach(c => {
                let chore = state.chores.find(ch => ch.id === c.choreId);
                if(chore) earnings += chore.amount;
            });
            let deductions = 0;
            state.deductions.forEach(d => {
                deductions += d.amount;
            });
            let total = earnings - deductions;
            document.getElementById('weekTotal').textContent = '$' + Math.max(0, total).toFixed(2);
        }

        function toggleChore(choreId, date) {
            let existing = state.completed.find(c => c.date === date && c.choreId === choreId);
            if(existing) {
                state.completed = state.completed.filter(c => !(c.date === date && c.choreId === choreId));
            } else {
                state.completed.push({ date, choreId });
            }
            save();
            syncToParent();
            render();
        }

        function syncToParent() {
            let parent = localStorage.getItem('parent-chores');
            if(parent) {
                try {
                    let p = JSON.parse(parent);
                    // Add Nicola's completions (teen id 1)
                    state.completed.forEach(c => {
                        let exists = p.completed.some(ac => ac.date === c.date && ac.teen === 1 && ac.choreId === c.choreId);
                        if(!exists) {
                            p.completed.push({ date: c.date, teen: 1, choreId: c.choreId, approved: false });
                        }
                    });
                    localStorage.setItem('parent-chores', JSON.stringify(p));
                } catch(e) { }
            }
        }

        load();
        setInterval(sync, 2000);
    </script>
</body>
</html>
